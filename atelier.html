<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我们的日常 — 记录与问答</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&family=Imprima&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #0a0608; scroll-behavior: auto; }
    html { scrollbar-gutter: stable; }
    body { font-family: 'Imprima', sans-serif; color: #fff; }
    * { box-sizing: border-box; }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 48px;
      background: linear-gradient(to bottom, rgba(10,6,8,0.95) 40%, rgba(10,6,8,0) 100%);
    }
    .nav-group { display: flex; align-items: center; gap: 30px; }
    .nav-link {
      text-transform: uppercase; font-size: 12px; letter-spacing: 0.12em;
      color: #fff; opacity: 0.8; text-decoration: none;
      transition: opacity 0.3s;
    }
    .nav-link:hover, .nav-link.active { opacity: 1; }
    .nav-logo { width: 28px; height: 28px; display: grid; place-items: center; text-decoration: none; }
    .nav-mobile { display: none; }

    /* ── Hero ── */
    .page-hero {
      padding: 130px 40px 20px; max-width: 700px; margin: 0 auto; text-align: center;
    }
    .hero-eyebrow {
      text-transform: uppercase; font-size: 11px; letter-spacing: 0.22em;
      color: rgba(255,255,255,0.4); margin-bottom: 12px;
    }
    .hero-heading {
      font-family: 'Viaoda Libre', serif; font-size: clamp(34px, 5vw, 56px);
      line-height: 1.1; letter-spacing: 0.02em; margin: 0 0 8px; color: #fff;
    }
    .hero-lead {
      font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.55);
    }

    /* ── Tabs ── */
    .tab-bar {
      display: flex; justify-content: center; gap: 0; margin: 24px auto;
      max-width: 400px; border-radius: 100px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .tab-btn {
      flex: 1; padding: 12px 24px; border: none; cursor: pointer;
      background: transparent; color: rgba(255,255,255,0.5);
      font-family: 'Imprima', sans-serif; font-size: 14px; letter-spacing: 0.06em;
      transition: all 0.35s;
    }
    .tab-btn.active { background: rgba(255,255,255,0.1); color: #fff; }
    .tab-btn:first-child { border-right: 1px solid rgba(255,255,255,0.12); }

    /* ── Tab panels ── */
    .tab-panel { display: none; max-width: 600px; margin: 0 auto; padding: 20px 30px 60px; }
    .tab-panel.active { display: block; }

    /* ── Daily Record ── */
    .record-today {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 24px; margin-bottom: 32px;
    }
    .record-date-label {
      font-family: 'Viaoda Libre', serif; font-size: 22px; color: #fff; margin-bottom: 4px;
    }
    .record-date-sub {
      font-size: 11px; letter-spacing: 0.1em; color: rgba(255,255,255,0.35); margin-bottom: 16px; text-transform: uppercase;
    }
    .record-textarea {
      width: 100%; min-height: 100px; padding: 14px 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05);
      color: #fff; font-family: 'Imprima', sans-serif; font-size: 14px; line-height: 1.6;
      resize: vertical; outline: none; margin-bottom: 14px;
    }
    .record-textarea::placeholder { color: rgba(255,255,255,0.25); }
    .record-textarea:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      display: inline-block; padding: 11px 28px; border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08);
      color: #fff; cursor: pointer; font-family: 'Imprima', sans-serif;
      font-size: 13px; letter-spacing: 0.06em; transition: all 0.3s;
    }
    .btn-primary:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.45); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
    .record-done-msg {
      display: inline-block; margin-left: 14px; font-size: 13px; color: rgba(255,255,255,0.5);
    }

    .history-list { margin-top: 10px; }
    .history-item {
      padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .history-date {
      font-size: 11px; letter-spacing: 0.12em; color: rgba(255,255,255,0.35); margin-bottom: 9px;
    }
    .history-content {
      font-size: 14px; line-height: 1.65; color: rgba(255,255,255,0.72);
    }

    /* ── Today's Question ── */
    .question-box {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 28px 24px; margin-bottom: 24px; text-align: center;
    }
    .question-icon { font-size: 36px; margin-bottom: 12px; }
    .question-text {
      font-family: 'Viaoda Libre', serif; font-size: 24px; line-height: 1.3;
      color: #fff; margin: 0 0 6px;
    }
    .question-date {
      font-size: 10px; letter-spacing: 0.12em; color: rgba(255,255,255,0.3); text-transform: uppercase;
    }
    .answer-section {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 24px; margin-bottom: 16px;
    }
    .answer-section h4 {
      font-size: 13px; letter-spacing: 0.08em; color: rgba(255,255,255,0.5); margin: 0 0 14px; text-transform: uppercase;
    }
    .answer-textarea {
      width: 100%; min-height: 80px; padding: 12px 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05);
      color: #fff; font-family: 'Imprima', sans-serif; font-size: 14px; line-height: 1.6;
      resize: vertical; outline: none; margin-bottom: 12px;
    }
    .answer-textarea::placeholder { color: rgba(255,255,255,0.25); }
    .answer-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn-secondary {
      padding: 10px 20px; border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.15); background: transparent;
      color: rgba(255,255,255,0.7); cursor: pointer; font-family: 'Imprima', sans-serif;
      font-size: 12px; letter-spacing: 0.06em; transition: all 0.3s;
    }
    .btn-secondary:hover { border-color: rgba(255,255,255,0.4); color: #fff; }
    .answer-reveal {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 24px; margin-top: 16px; display: none;
    }
    .answer-reveal.show { display: block; }
    .answer-badge {
      display: inline-block; padding: 4px 12px; border-radius: 100px;
      font-size: 11px; letter-spacing: 0.06em; margin-bottom: 10px;
    }
    .answer-badge.me { background: rgba(255,179,179,0.2); color: #ffb3b3; }
    .answer-badge.ta { background: rgba(179,200,255,0.2); color: #b3c8ff; }
    .reveal-text {
      font-size: 14px; line-height: 1.65; color: rgba(255,255,255,0.7);
    }

    /* ── Footer ── */
    .page-footer {
      text-align: center; padding: 30px 20px 50px;
      border-top: 1px solid rgba(255,255,255,0.06); max-width: 700px; margin: 0 auto;
    }
    .footer-back {
      display: inline-flex; align-items: center; gap: 10px;
      color: rgba(255,255,255,0.5); text-decoration: none;
      font-size: 13px; letter-spacing: 0.1em; transition: color 0.3s;
    }
    .footer-back:hover { color: #fff; }
    .footer-back svg { width: 16px; height: 16px; }

    /* Focus visibility — WCAG 2.4.7 */
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid rgba(255,255,255,0.6); outline-offset: 3px; border-radius: 4px;
    }
    .tab-btn:focus-visible { outline-offset: -3px; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 767px) {
      nav { padding: 18px 20px; }
      .nav-group { display: none; }
      .nav-mobile { display: flex; align-items: center; justify-content: space-between; width: 100%; }
      .page-hero { padding: 100px 20px 10px; }
      .tab-panel { padding: 10px 16px 40px; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-group">
      <a class="nav-link" href="index.html">首页</a>
      <a class="nav-link" href="worlds.html">照片墙</a>
      <a class="nav-link active" href="atelier.html">日常</a>
      <a class="nav-link" href="codex.html">留言</a>
      <a href="index.html" class="nav-logo" aria-label="返回首页" style="margin-left:20px;">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2l2.09 6.42H23l-5.45 3.96L19.64 19 14 15.04 8.36 19l2.09-6.62L5 8.42h6.91L14 2z" fill="#fff"/>
        </svg>
      </a>
    </div>
    <div class="nav-mobile">
      <a class="nav-link" href="index.html">首页</a>
      <a href="index.html" class="nav-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2l2.09 6.42H23l-5.45 3.96L19.64 19 14 15.04 8.36 19l2.09-6.62L5 8.42h6.91L14 2z" fill="#fff"/>
        </svg>
      </a>
      <a class="nav-link" href="codex.html">留言</a>
    </div>
  </nav>

  <section class="page-hero">
    <p class="hero-eyebrow">Daily · 📝</p>
    <h1 class="hero-heading">我们的日常</h1>
    <p class="hero-lead">每一天都值得被记住。无论是细碎的日常，还是灵魂的问答 —— 都是我们之间最真实的连接。</p>
  </section>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('record')">每日记录</button>
    <button class="tab-btn" onclick="switchTab('question')">今日问题</button>
  </div>

  <!-- Tab: 每日记录 -->
  <div class="tab-panel active" id="tab-record">
    <div class="record-today">
      <p class="record-date-label" id="record-date-label">2024年1月1日</p>
      <p class="record-date-sub" id="record-date-sub">星期一</p>
      <textarea class="record-textarea" id="record-input" placeholder="今天想记录什么？" aria-label="今日记录内容"></textarea>
      <button class="btn-primary" id="record-save-btn" onclick="saveRecord()">💾 保存今日记录</button>
      <span class="record-done-msg" id="record-done-msg"></span>
    </div>
    <div class="history-list" id="history-list">
      <!-- JS filled -->
    </div>
  </div>

  <!-- Tab: 今日问题 -->
  <div class="tab-panel" id="tab-question">
    <div class="question-box">
      <div class="question-icon">❓</div>
      <p class="question-text" id="question-text">—</p>
      <p class="question-date" id="question-date">—</p>
    </div>

    <div class="answer-section">
      <h4>✍️ 我的回答</h4>
      <textarea class="answer-textarea" id="my-answer-input" placeholder="写下你的答案..." aria-label="我的回答"></textarea>
      <div class="answer-row">
        <button class="btn-primary" onclick="submitAnswer('me')">提交我的回答</button>
        <button class="btn-secondary" onclick="revealTA()">👀 看 TA 的回答</button>
      </div>
    </div>

    <div class="answer-reveal" id="answer-reveal">
      <h4>💙 TA 的回答</h4>
      <p class="reveal-text" id="ta-answer-text">TA 还没有回答这个问题。</p>
    </div>
  </div>

  <footer class="page-footer">
    <a href="index.html" class="footer-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      返回首页
    </a>
  </footer>

  <script>
    // ── localStorage helpers ──
    function lsGet(key, def) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e) { return def; } }
    function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

    var RECORDS_KEY = 'couple_records';
    var ANSWERS_KEY = 'couple_answers';
    var QUESTIONS_KEY = 'couple_questions';

    // ── Pre-seeded questions ──
    var defaultQuestions = [
      '你第一次见到 TA 时，心里在想什么？',
      '如果我们可以去任何地方旅行，你最想去哪里？',
      '你最喜欢 TA 的哪一个习惯？',
      '说一件 TA 为你做过让你特别感动的事。',
      '你觉得两个人在一起最重要的是什么？',
      '如果可以回到过去，你想一起重温哪一个瞬间？',
      '你最期待我们一起完成的一件事是什么？',
      '你最喜欢 TA 笑的时候是什么样子？',
      '有没有哪一首歌让你想到 TA？',
      '你觉得五年后的我们会是什么样子？',
      '两个人之间发生分歧时，你觉得最好的解决方式是什么？',
      '说一个你还没有告诉 TA 的小秘密。',
      '你最喜欢和 TA 一起做的日常小事是什么？',
      '如果可以给 TA 写一封信，你会写什么？',
      '你觉得爱是什么？'
    ];
    var questions = lsGet(QUESTIONS_KEY, defaultQuestions);
    lsSet(QUESTIONS_KEY, questions);

    // ── Daily question (deterministic by date) ──
    function getTodayStr() { return new Date().toISOString().slice(0, 10); }
    function getQuestionForDate(dateStr) {
      var d = new Date(dateStr + 'T00:00:00');
      var idx = Math.floor(d.getTime() / (1000 * 60 * 60 * 24)) % questions.length;
      return questions[idx];
    }

    // ── Daily record ──
    function formatDateChinese(d) {
      var weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 — 星期' + weekdays[d.getDay()];
    }

    var records = lsGet(RECORDS_KEY, []);
    // Pre-seed if empty
    if (records.length === 0) {
      var today = new Date();
      for (var i = 2; i >= 0; i--) {
        var d = new Date(today);
        d.setDate(d.getDate() - i);
        var ds = d.toISOString().slice(0, 10);
        var samples = ['今天一起做饭，TA 做的红烧肉特别好吃。', '下班后一起去公园散步，看到了很美的日落。', '窝在沙发上看了一整天的电影，是最近最放松的一天。'];
        records.push({ date: ds, content: samples[i] });
      }
      lsSet(RECORDS_KEY, records);
    }

    function renderRecords(keepMsg) {
      var todayStr = getTodayStr();
      var d = new Date();
      document.getElementById('record-date-label').textContent = formatDateChinese(d);
      document.getElementById('record-date-sub').textContent = todayStr;

      var todayRecord = null;
      for (var i = 0; i < records.length; i++) {
        if (records[i].date === todayStr) { todayRecord = records[i]; break; }
      }

      var input = document.getElementById('record-input');
      var btn = document.getElementById('record-save-btn');
      var msg = document.getElementById('record-done-msg');

      if (todayRecord) {
        input.value = todayRecord.content;
        input.disabled = false;
        btn.textContent = '💾 更新今日记录';
        btn.disabled = false;
        if (!keepMsg) msg.textContent = '📝 可以继续编辑今天的记录';
      } else {
        input.value = '';
        input.disabled = false;
        btn.disabled = false;
        if (!keepMsg) msg.textContent = '';
      }

      // Render history
      var list = document.getElementById('history-list');
      var html = '';
      var sorted = records.slice().sort(function(a, b) { return b.date.localeCompare(a.date); });
      for (var i = 0; i < sorted.length; i++) {
        html += '<div class="history-item"><p class="history-date">📅 ' + sorted[i].date + '</p><p class="history-content">' + sorted[i].content.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</p></div>';
      }
      list.innerHTML = html || '<p style="color:rgba(255,255,255,0.3);text-align:center;padding:30px;">还没有记录，写下你的第一条吧 ✨</p>';
    }

    function saveRecord() {
      var input = document.getElementById('record-input');
      var content = input.value.trim();
      if (!content) { alert('请先写点内容'); return; }
      var todayStr = getTodayStr();
      var found = false;
      for (var i = 0; i < records.length; i++) {
        if (records[i].date === todayStr) { records[i].content = content; found = true; break; }
      }
      if (!found) { records.push({ date: todayStr, content: content }); }
      lsSet(RECORDS_KEY, records);
      input.value = '';
      renderRecords(true);
      var msg = document.getElementById('record-done-msg');
      msg.textContent = found ? '✅ 已更新！' : '✅ 已保存！';
    }

    // ── Today's question ──
    function renderQuestion() {
      var todayStr = getTodayStr();
      var q = getQuestionForDate(todayStr);
      document.getElementById('question-text').textContent = q;
      document.getElementById('question-date').textContent = '📅 ' + todayStr + ' · 每日一问';

      // Load existing answers for today
      var answers = lsGet(ANSWERS_KEY, {});
      var todayAnswers = answers[todayStr] || {};
      if (todayAnswers.me) {
        document.getElementById('my-answer-input').value = todayAnswers.me;
      }
      document.getElementById('answer-reveal').classList.remove('show');
    }

    function submitAnswer(who) {
      var input = document.getElementById('my-answer-input');
      var text = input.value.trim();
      if (!text) { alert('请先写下你的回答'); return; }
      var todayStr = getTodayStr();
      var answers = lsGet(ANSWERS_KEY, {});
      if (!answers[todayStr]) answers[todayStr] = {};
      answers[todayStr][who] = text;
      lsSet(ANSWERS_KEY, answers);
      alert('回答已保存 💕');
    }

    function revealTA() {
      var todayStr = getTodayStr();
      var answers = lsGet(ANSWERS_KEY, {});
      var todayAnswers = answers[todayStr] || {};
      var taText = todayAnswers.ta || 'TA 还没有回答今天的问题。';
      document.getElementById('ta-answer-text').textContent = taText;
      document.getElementById('answer-reveal').classList.add('show');
    }

    // ── Tab switching ──
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
      if (tab === 'record') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('tab-record').classList.add('active');
        renderRecords();
      } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('tab-question').classList.add('active');
        renderQuestion();
      }
    }

    // Init
    renderRecords();
  </script>
</body>
</html>
